# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include:
        - "*"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
# Eureka client configuration to add edge server as a eureka client to the eurerka server
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultzone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
